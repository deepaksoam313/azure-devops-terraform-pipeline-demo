apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nginx-secret
  namespace: eso-test
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: nginx-secret
    creationPolicy: Owner

  data:
  - secretKey: APP_COLOR
    remoteRef:
      key: eso-test/nginx
      property: APP_COLOR

  - secretKey: APP_MESSAGE
    remoteRef:
      key: eso-test/nginx
      property: APP_MESSAGE

  - secretKey: DB_PASSWORD
    remoteRef:
      key: eso-test/nginx
      property: DB_PASSWORD
